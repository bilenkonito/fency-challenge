# Runs the three backend services together.
#
# Network topology:
#   - "public"  : bridge network for services that the host/browser reach
#                 (auth-service, blacklist-service publish ports here).
#   - "internal": private network (internal: true => no external connectivity)
#                 shared by the backend services and the data-service. The
#                 data-service publishes NO ports and lives only here, so it is
#                 reachable solely by its Docker DNS name "data-service" from
#                 sibling services — never from the host or the internet.
#
# Secrets come from a .env file (copy .env.example to .env); nothing is
# hardcoded. JWT_SECRET is shared by auth + blacklist; DATA_SERVICE_API_KEY is
# shared by all three so the auth and blacklist services can call the data-service.

services:
  data-service:
    build: ./data-service
    image: fency/data-service
    environment:
      PORT: "9090"
      # Default ODBC DSN points at a local SQLite file on the persisted volume.
      # Swap this for any ODBC DSN (PostgreSQL, SQL Server, …) to change backend.
      ODBC_DSN: ${ODBC_DSN:-Driver=SQLite3;Database=/data/fency.db;}
      DATA_SERVICE_API_KEY: ${DATA_SERVICE_API_KEY:?DATA_SERVICE_API_KEY must be set, e.g. in a .env file}
      SEED_USER: ${SEED_USER:-admin}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-ChangeMe123!}
      SEED_DOMAINS: ${SEED_DOMAINS:-malware-example.com,phishing-example.net}
    volumes:
      - data-db:/data
    networks:
      - internal
    # NOTE: intentionally no "ports:" — never exposed outside the private network.
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    image: fency/auth-service
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, e.g. in a .env file}
      JWT_ISSUER: ${JWT_ISSUER:-fency-auth}
      TOKEN_TTL: ${TOKEN_TTL:-60m}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATA_SERVICE_URL: http://data-service:9090
      DATA_SERVICE_API_KEY: ${DATA_SERVICE_API_KEY:?DATA_SERVICE_API_KEY must be set}
    ports:
      - "8080:8080"
    depends_on:
      - data-service
    networks:
      - public
      - internal
    restart: unless-stopped

  blacklist-service:
    build: ./blacklist-service
    image: fency/blacklist-service
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, e.g. in a .env file}
      JWT_ISSUER: ${JWT_ISSUER:-fency-auth}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      DATA_SERVICE_URL: http://data-service:9090
      DATA_SERVICE_API_KEY: ${DATA_SERVICE_API_KEY:?DATA_SERVICE_API_KEY must be set}
    ports:
      - "3000:3000"
    depends_on:
      - data-service
      - auth-service
    networks:
      - public
      - internal
    restart: unless-stopped

volumes:
  data-db:

networks:
  public:
  internal:
    internal: true
