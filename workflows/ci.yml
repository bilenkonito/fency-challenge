name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-service:
    name: auth-service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: auth-service/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          JWT_SECRET: ci-test-secret-at-least-16-chars
        run: go test -race ./...

      - name: Build
        run: go build -mod=vendor ./...

  blacklist-service:
    name: blacklist-service (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blacklist-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blacklist-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        env:
          JWT_SECRET: ci-test-secret-at-least-16-chars
        run: npm test

  web-ui:
    name: web-ui (Vue + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
